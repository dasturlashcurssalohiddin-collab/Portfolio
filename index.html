<!doctype html>
<html lang="uz">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Teshaboyev Salohiddin - Portfolio</title>
  <style>
    :root {
      --ink: #101828; --muted: #667085; --line: #e5e7eb; --paper: #ffffff; --soft: #f7f8fa;
      --brand: #0f766e; --brand-dark: #0b5d57; --radius: 12px; --max: 900px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: Inter, system-ui, -apple-system, sans-serif;
      color: var(--ink); background: var(--soft); line-height: 1.6; padding-bottom: 60px;
    }
    a { text-decoration: none; color: inherit; }
    .container { width: min(calc(100% - 40px), var(--max)); margin: auto; }
    
    /* Header */
    header { background: #fff; border-bottom: 1px solid var(--line); padding: 16px 0; position: sticky; top: 0; z-index: 10; }
    .header-inner { display: flex; justify-content: space-between; align-items: center; }
    .header-inner h1 { font-size: 18px; font-weight: 700; color: var(--brand); }
    .admin-link { font-size: 14px; font-weight: 600; color: var(--muted); border: 1px solid var(--line); padding: 6px 12px; border-radius: 8px; transition: 0.2s; }
    .admin-link:hover { background: var(--soft); color: var(--ink); }

    /* Sections */
    section { margin-top: 40px; }
    .card { background: #fff; border: 1px solid var(--line); border-radius: var(--radius); padding: 30px; box-shadow: 0 2px 5px rgba(0,0,0,0.02); }
    h2.section-title { font-size: 22px; margin-bottom: 20px; border-bottom: 2px solid var(--soft); padding-bottom: 10px; color: var(--ink); }
    
    /* Hero */
    .hero { display: flex; gap: 30px; align-items: center; }
    .hero-img { width: 120px; height: 120px; border-radius: 50%; object-fit: cover; border: 4px solid #fff; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
    .hero-content h1 { font-size: 32px; line-height: 1.2; margin-bottom: 10px; }
    .hero-eyebrow { color: var(--brand); font-weight: 600; font-size: 14px; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 5px; }
    .hero-intro { color: var(--muted); font-size: 18px; }

    /* Grid Layouts */
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
    @media(max-width: 640px) { .grid-2 { grid-template-columns: 1fr; } .hero { flex-direction: column; text-align: center; } }

    /* Items */
    .fact-item, .stat-item, .achievement-item { background: var(--soft); padding: 15px; border-radius: 8px; border: 1px solid var(--line); }
    .fact-key { font-weight: 600; font-size: 14px; color: var(--muted); }
    .fact-val { font-weight: 700; font-size: 16px; margin-top: 5px; }
    
    .project-card { border: 1px solid var(--line); border-radius: 8px; padding: 20px; transition: 0.3s; display: block;}
    .project-card:hover { border-color: var(--brand); box-shadow: 0 4px 12px rgba(15, 118, 110, 0.1); transform: translateY(-2px); }
    .proj-type { font-size: 12px; color: var(--brand); font-weight: 700; text-transform: uppercase; }
    .proj-name { font-size: 18px; font-weight: 700; margin: 8px 0; }
    .proj-desc { font-size: 14px; color: var(--muted); margin-bottom: 15px; }
    .proj-tags span { background: var(--soft); padding: 4px 8px; border-radius: 4px; font-size: 12px; font-weight: 600; margin-right: 6px; border: 1px solid var(--line); }

    /* Form */
    .field { display: flex; flex-direction: column; gap: 8px; margin-bottom: 16px; }
    .field label { font-size: 14px; font-weight: 600; color: var(--ink); }
    .field input, .field textarea { width: 100%; border: 1px solid var(--line); border-radius: 8px; padding: 12px; font-family: inherit; font-size: 14px; outline: none; transition: 0.2s; }
    .field input:focus, .field textarea:focus { border-color: var(--brand); box-shadow: 0 0 0 3px rgba(15,118,110,0.1); }
    .field textarea { min-height: 120px; resize: vertical; }
    .btn-primary { background: var(--brand); color: #fff; border: none; padding: 12px 24px; border-radius: 8px; font-weight: 600; cursor: pointer; transition: 0.2s; font-size: 15px; width: 100%; }
    .btn-primary:hover { background: var(--brand-dark); }
    .btn-primary:disabled { opacity: 0.7; cursor: not-allowed; }

  </style>
</head>
<body>

<header>
  <div class="container header-inner">
    <h1 id="navName">Portfolio</h1>
    <a href="admin.html" class="admin-link">Admin Panel ⚙️</a>
  </div>
</header>

<main class="container">
  
  <!-- Hero Section -->
  <section class="card hero">
    <img id="uiImage" src="https://via.placeholder.com/120" alt="Profile Image" class="hero-img">
    <div class="hero-content">
      <div id="uiEyebrow" class="hero-eyebrow">Developer</div>
      <h1 id="uiTitle">Ism Sharif</h1>
      <p id="uiIntro" class="hero-intro">Qisqa ma'lumot</p>
    </div>
  </section>

  <!-- About & Facts -->
  <section class="card">
    <h2 class="section-title">Men Haqimda</h2>
    <div id="uiAbout" style="margin-bottom: 24px; color: var(--muted);"></div>
    <div id="uiFacts" class="grid-2"></div>
  </section>

  <!-- Skills & Stats -->
  <section class="card">
    <h2 class="section-title">Ko'nikma va Statistikalar</h2>
    <div id="uiStats" class="grid-2" style="margin-bottom: 24px;"></div>
    <div id="uiSkills"></div>
  </section>

  <!-- Projects -->
  <section class="card">
    <h2 class="section-title">Loyihalar</h2>
    <div id="uiProjects" class="grid-2"></div>
  </section>

  <!-- Achievements -->
  <section class="card">
    <h2 class="section-title">Ta'lim va Yutuqlar</h2>
    <div id="uiAchievements" class="grid-2"></div>
  </section>

  <!-- Contact Form (Telegram Bot) -->
  <section class="card">
    <h2 class="section-title">Men bilan bog'lanish</h2>
    <form id="tgContactForm">
      <div class="field">
        <label>Ismingiz</label>
        <input type="text" id="tgName" placeholder="Ismingizni kiriting" required>
      </div>
      <div class="field">
        <label>Telefon raqam yoki Telegram username</label>
        <input type="text" id="tgContact" placeholder="+998901234567 yoki @username" required>
      </div>
      <div class="field">
        <label>Xabaringiz</label>
        <textarea id="tgMessage" placeholder="Salom, men siz bilan hamkorlik qilmoqchiman..." required></textarea>
      </div>
      <button type="submit" class="btn-primary" id="tgSendBtn">Xabarni yuborish</button>
    </form>
  </section>

</main>

<script>
  // 1. MA'LUMOTLARNI YUKLASH (LocalStorage'dan)
  const LOCAL_STORAGE_KEY = "salohiddin-portfolio-v3-local";
  
  // Standart ma'lumotlar (agar saytga birinchi marta kirilsa)
  const defaults = {
    profile: {
      name: "Teshaboyev Salohiddin",
      eyebrow: "Young Developer · Uzbekistan",
      title: "Teshaboyev<br>Salohiddin",
      intro: "Python, C++ va web texnologiyalari bilan ishlovchi yosh dasturchi.",
      about: ["Men Teshaboyev Salohiddin — dasturlash va texnologiyalarga qiziquvchi o'quvchiman."],
      facts: [["Ism", "Teshaboyev Salohiddin"], ["Maktab", "10-IDUM"]],
      image: "https://via.placeholder.com/120?text=Rasm+yoq"
    },
    stats: [["Python", "Asosiy yo'nalish"], ["Web", "Amaliy loyihalar"]],
    skills: [{group: "Dasturlash tillari", items: [["Python", 85, "Asosiy"]]}],
    projects: [{name: "Tuxum Market Bot", type: "Telegram Bot", desc: "Tuxum sotish bot", tags: ["Python", "Aiogram"], url: "#"}],
    achievements: [["10-IDUM", "Ixtisoslashtirilgan maktab"]],
  };

  let siteData = defaults;
  try {
    const saved = localStorage.getItem(LOCAL_STORAGE_KEY);
    if(saved) siteData = JSON.parse(saved);
  } catch(e) { console.error("Xotiradan o'qishda xato"); }

  // 2. HTML ELEMENTLARGA MA'LUMOTLARNI JOYLASHTIRISH
  function escapeHTML(str) {
    return String(str || "").replace(/[&<>"']/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
  }

  // Profile
  const p = siteData.profile || {};
  document.getElementById("navName").textContent = p.name || "Portfolio";
  document.getElementById("uiEyebrow").textContent = p.eyebrow || "";
  document.getElementById("uiTitle").innerHTML = p.title || p.name;
  document.getElementById("uiIntro").textContent = p.intro || "";
  if(p.image) document.getElementById("uiImage").src = p.image;
  
  // About
  const aboutHtml = (p.about || []).map(text => `<p style="margin-bottom:10px">${escapeHTML(text)}</p>`).join("");
  document.getElementById("uiAbout").innerHTML = aboutHtml;

  // Facts
  const factsHtml = (p.facts || []).map(([k, v]) => `
    <div class="fact-item">
      <div class="fact-key">${escapeHTML(k)}</div>
      <div class="fact-val">${escapeHTML(v)}</div>
    </div>
  `).join("");
  document.getElementById("uiFacts").innerHTML = factsHtml;

  // Stats
  const statsHtml = (siteData.stats || []).map(([k, v]) => `
    <div class="stat-item">
      <div class="fact-key">${escapeHTML(v)}</div>
      <div class="fact-val" style="color: var(--brand); font-size: 20px;">${escapeHTML(k)}</div>
    </div>
  `).join("");
  document.getElementById("uiStats").innerHTML = statsHtml;

  // Skills
  const skillsHtml = (siteData.skills || []).map(group => {
    const items = (group.items || []).map(item => `
      <div style="margin-bottom:10px">
        <div style="display:flex; justify-content:space-between; font-size:14px; font-weight:600; margin-bottom:4px;">
          <span>${escapeHTML(item[0])} <small style="color:var(--muted)">(${escapeHTML(item[2])})</small></span>
          <span>${item[1]}%</span>
        </div>
        <div style="background:var(--line); height:8px; border-radius:4px; overflow:hidden;">
          <div style="background:var(--brand); height:100%; width:${item[1]}%;"></div>
        </div>
      </div>
    `).join("");
    return `<div style="margin-bottom: 20px"><h3 style="font-size:16px; margin-bottom:12px;">${escapeHTML(group.group)}</h3>${items}</div>`;
  }).join("");
  document.getElementById("uiSkills").innerHTML = skillsHtml;

  // Projects
  const projHtml = (siteData.projects || []).map(proj => {
    const tags = (proj.tags || []).map(t => `<span>${escapeHTML(t)}</span>`).join("");
    return `
      <a href="${escapeHTML(proj.url || '#')}" target="_blank" class="project-card">
        <div class="proj-type">${escapeHTML(proj.type)}</div>
        <div class="proj-name">${escapeHTML(proj.name)}</div>
        <div class="proj-desc">${escapeHTML(proj.desc)}</div>
        <div class="proj-tags">${tags}</div>
      </a>
    `;
  }).join("");
  document.getElementById("uiProjects").innerHTML = projHtml;

  // Achievements
  const achHtml = (siteData.achievements || []).map(([title, desc]) => `
    <div class="achievement-item">
      <div class="fact-val">${escapeHTML(title)}</div>
      <div class="fact-key" style="margin-top:2px;">${escapeHTML(desc)}</div>
    </div>
  `).join("");
  document.getElementById("uiAchievements").innerHTML = achHtml;

  // 3. TELEGRAM BOTGA XABAR YUBORISH MANTIQI
  const BOT_TOKEN = "8656295440:AAEUBRVs4umfJkh-YPm3XMJh52R3e9l56bw";
  const CHAT_ID = "6283517295";

  document.getElementById("tgContactForm").addEventListener("submit", async function(e) {
    e.preventDefault(); 

    const sendBtn = document.getElementById("tgSendBtn");
    const name = document.getElementById("tgName").value;
    const contact = document.getElementById("tgContact").value;
    const message = document.getElementById("tgMessage").value;

    sendBtn.disabled = true;
    sendBtn.textContent = "Yuborilmoqda... ⏳";

    const text = `📬 **Yangi xabar (Portfolio saytdan):**\n\n👤 **Ism:** ${name}\n📞 **Aloqa:** ${contact}\n💬 **Xabar:**\n${message}`;

    try {
      const response = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          chat_id: CHAT_ID,
          text: text,
          parse_mode: "Markdown"
        })
      });

      const data = await response.json();

      if (data.ok) {
        alert("Xabaringiz muvaffaqiyatli yuborildi! Tez orada siz bilan bog'lanaman.");
        document.getElementById("tgContactForm").reset(); 
      } else {
        alert("Xatolik: Xabar yuborilmadi. Iltimos, keyinroq qayta urinib ko'ring.");
      }
    } catch (error) {
      alert("Tarmoqda xatolik yuz berdi. Internet ulanishini tekshiring.");
    } finally {
      sendBtn.disabled = false;
      sendBtn.textContent = "Xabarni yuborish";
    }
  });
</script>
</body>
</html>
